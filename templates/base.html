
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OrderParser{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                OrderParser
            </a>
            <nav class="main-nav">
                <a href="/">Главная</a>
                <a href="/orders">Список заказов</a>
                <a href="/orders/new">Добавить заказ</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            OrderParser — версия {{ version }} · Разработка продолжается
        </div>
    </footer>
</body>
</html>
