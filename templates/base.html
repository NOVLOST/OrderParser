<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OrderParser{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="/">
                    <i class="bi bi-truck me-1"></i>OrderParser
                </a>
                <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false"
                aria-label="Меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                   <li class="nav-item dropdown">
                    <a class="nav-link position-relative" href="#" id="notifBell"
                    role="button" data-bs-toggle="dropdown"
                    data-bs-auto-close="outside" aria-expanded="false">
                    <i class="bi bi-bell"></i>
                    <span id="notifBadge"
                    class="position-absolute top-0 start-100 translate-middle
                    badge rounded-pill bg-danger d-none">0</span>
                </a>

                <div class="dropdown-menu dropdown-menu-end shadow p-0"
                style="width: 360px; max-height: 420px; overflow-y: auto;"
                aria-labelledby="notifBell">

                <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                    <span class="fw-semibold">Уведомления</span>
                </div>

                <div id="notifList">
                    <div class="text-center text-muted small py-3">Загрузка…</div>
                </div>
            </div>
        </li>
        <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="/orders">Список заказов</a></li>
        <li class="nav-item"><a class="nav-link" href="/orders/new">Добавить заказ</a></li>
    </ul>
</div>
</div>
</nav>
</header>

<main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-secondary py-3 mt-auto">
    <div class="container small">
        OrderParser — версия {{ version }} · Разработка продолжается
    </div>
</footer>

<script src="/static/vendor/bootstrap.bundle.min.js"> </script>
 
 <script>   
(function () {
    const bell  = document.getElementById('notifBell');
    const badge = document.getElementById('notifBadge');
    const list  = document.getElementById('notifList');
    if (!bell || !list) return;

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    async function loadNotifications() {
        try {
            const r = await fetch('/api/notifications', { cache: 'no-store' });
            if (!r.ok) throw new Error(r.status);
            const data = await r.json();

            if (data.unread > 0) {
                badge.textContent = data.unread;
                badge.classList.remove('d-none');
            } else {
                badge.classList.add('d-none');
            }

            if (!data.items.length) {
                list.innerHTML =
                    '<div class="text-center text-muted small py-3">' +
                    'Новых уведомлений нет</div>';
                return;
            }

            list.innerHTML = data.items.map(n => `
                <a href="/orders/${n.order_id}"
                   class="dropdown-item py-2 border-bottom text-wrap"
                   data-id="${n.id}">
                    <div class="small">${esc(n.message)}</div>
                    <div class="text-muted" style="font-size:.75rem">
                        ${n.created_at}
                    </div>
                </a>
            `).join('');

            list.querySelectorAll('[data-id]').forEach(el => {
                el.addEventListener('click', () => {
                    fetch(`/api/notifications/${el.dataset.id}/read`,
                          { method: 'POST' });
                });
            });
        } catch (e) {
            list.innerHTML =
                '<div class="text-danger small p-3">Не удалось загрузить</div>';
            console.error('[notif]', e);
        }
    }

    bell.addEventListener('show.bs.dropdown', loadNotifications);
    loadNotifications();                 // бейдж сразу
    setInterval(loadNotifications, 15000); // свежие подтягиваются
})();


</script>
</body>
</html>
