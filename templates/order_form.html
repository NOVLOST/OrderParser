{% extends "base.html" %}

{% block title %}OrderParser — добавить заказ{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Добавить заказ</h1>
    <p class="lead">
        Внесите заказ вручную, если он ещё не подтянулся с площадки.
    </p>
</section>

{% if error %}
    <div class="alert alert-error">
        <strong>Не удалось сохранить заказ.</strong>
        <p>{{ error }}</p>
    </div>
{% endif %}

<form method="post" action="/orders/new" class="order-form">
    <div class="form-row">
        <label for="where_from">Откуда</label>
        <input
            type="text"
            id="where_from"
            name="where_from"
            value="{{ form.where_from or '' }}"
            placeholder="Например, Ульяновск"
            required
        >
    </div>

    <div class="form-row">
        <label for="where_to">Куда</label>
        <input
            type="text"
            id="where_to"
            name="where_to"
            value="{{ form.where_to or '' }}"
            placeholder="Например, Москва"
            required
        >
    </div>

    <div class="form-row">
        <label for="cargo">Груз</label>
        <input
            type="text"
            id="cargo"
            name="cargo"
            value="{{ form.cargo or '' }}"
            placeholder="Например, мебель"
            required
        >
    </div>

    <div class="form-row">
        <label for="price">Цена, ₽</label>
        <input
            type="text"
            id="price"
            name="price"
            value="{{ form.price or '' }}"
            placeholder="Например, 45000"
            inputmode="numeric"
            required
        >
    </div>

    <div class="form-row">
        <label for="source_place">Площадка</label>
        <select name="source_place" id="source_place" required>
            {% for src in sources %}
                <option
                    value="{{ src.id }}"
                    {% if form.source_place == src.id|string %}selected{% endif %}
                >
                    {{ src.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-actions">
        <button type="submit">Сохранить</button>
        <a class="cancel-link" href="/orders">Отмена</a>
    </div>
</form>

<p class="back-link">
    <a href="/">← На главную</a>
</p>
{% endblock %}
